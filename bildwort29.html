<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch lernen: Bild-Wort-Matching</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }

        p.instruction {
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Responsives CSS-Grid für Kacheln */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Styling der Kacheln */
        .card {
            background-color: #fff;
            border: 3px solid #bdc3c7;
            border-radius: 10px;
            padding: 20px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Interaktive Kachel-Zustände */
        .card:hover {
            transform: translateY(-3px);
            border-color: #34495e;
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }

        .card.selected {
            border-color: #3498db;
            background-color: #ebf5fb;
            transform: scale(1.02);
        }

        .card.matched {
            background-color: #e8f8f0;
            border-color: #2ecc71;
            color: #27ae60;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        /* Inhalt der Kacheln */
        .card-emoji {
            font-size: 3rem;
            margin-bottom: 8px;
        }

        .card-text {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .card-caption {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
            font-style: italic;
        }

        /* Feedback und Button */
        .feedback-zone {
            text-align: center;
            min-height: 80px;
        }

        .btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1a252f;
        }

        .result-message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 28px;
        }

        .result-message.success {
            color: #2ecc71;
        }

        /* RESPONSIVE DESIGN ANPASSUNGEN */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .game-container {
                padding: 15px;
            }

            /* Auf ganz kleinen Bildschirmen strikt zweispaltig erzwingen */
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 12px;
                min-height: 120px;
            }

            .card-emoji {
                font-size: 2.3rem;
            }

            .card-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Bild-Wort-Matching</h1>
    <p class="instruction">Finde die passenden Paare! Wähle zuerst eine Kachel und tippe anschließend auf das Gegenstück.</p>

    <div class="grid-container" id="grid">
        <!-- Die Kacheln werden dynamisch via JavaScript generiert -->
    </div>

    <div class="feedback-zone">
        <button class="btn" id="reset-btn" style="display: none;">Neustart</button>
        <div id="result" class="result-message"></div>
    </div>
</div>

<script>
    // Definition der Datenpaare (ID verbindet Bild und Begriff)
    const pairs = [
        {
            id: 1,
            type: 'image',
            emoji: '🙃👕',
            caption: '(Kleidung verkehrt herum/auf links)'
        },
        {
            id: 1,
            type: 'word',
            text: 'шиворот-навыворот'
        },
        {
            id: 2,
            type: 'image',
            emoji: '👚',
            caption: '(Jacke / Pullover)'
        },
        {
            id: 2,
            type: 'word',
            text: 'кофта'
        },
        {
            id: 3,
            type: 'image',
            emoji: '🔄🚶',
            caption: '(Sich umziehen)'
        },
        {
            id: 3,
            type: 'word',
            text: 'переоденься'
        }
    ];

    const grid = document.getElementById('grid');
    const resetBtn = document.getElementById('reset-btn');
    const resultDiv = document.getElementById('result');

    let firstSelectedCard = null;
    let matchedPairsCount = 0;

    // Spiel initialisieren und Karten mischen
    function initGame() {
        grid.innerHTML = '';
        resultDiv.textContent = '';
        resultDiv.className = 'result-message';
        resetBtn.style.display = 'none';
        firstSelectedCard = null;
        matchedPairsCount = 0;

        // Karten zufällig durchmischen
        const shuffledCards = [...pairs].sort(() => Math.random() - 0.5);

        // Kacheln dynamisch im DOM erzeugen
        shuffledCards.forEach(cardData => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.id = cardData.id;
            card.dataset.type = cardData.type;

            if (cardData.type === 'image') {
                card.innerHTML = `
                    <div class="card-emoji">${cardData.emoji}</div>
                    <div class="card-caption">${cardData.caption}</div>
                `;
            } else {
                card.innerHTML = `<div class="card-text">${cardData.text}</div>`;
            }

            card.addEventListener('click', onCardClick);
            grid.appendChild(card);
        });
    }

    // Klick-Logik für die Kacheln
    function onCardClick() {
        // Ignorieren, wenn die Karte bereits richtig gelöst wurde
        if (this.classList.contains('matched')) return;

        // Ignorieren, wenn dieselbe Karte nochmals geklickt wird
        if (firstSelectedCard === this) {
            this.classList.remove('selected');
            firstSelectedCard = null;
            return;
        }

        // Erste Karte auswählen
        if (!firstSelectedCard) {
            firstSelectedCard = this;
            this.classList.add('selected');
            resultDiv.textContent = ''; // Feedback zurücksetzen
            return;
        }

        // Zweite Karte prüfen
        const secondSelectedCard = this;

        // Prüfen, ob die IDs übereinstimmen UND es sich um unterschiedliche Typen handelt (Wort + Bild)
        if (firstSelectedCard.dataset.id === secondSelectedCard.dataset.id && 
            firstSelectedCard.dataset.type !== secondSelectedCard.dataset.type) {
            
            // Match erfolgreich!
            firstSelectedCard.classList.remove('selected');
            firstSelectedCard.classList.add('matched');
            secondSelectedCard.classList.add('matched');
            
            matchedPairsCount++;
            firstSelectedCard = null;

            // Prüfen, ob das gesamte Spiel beendet ist
            if (matchedPairsCount === pairs.length / 2) {
                resultDiv.className = 'result-message success';
                resultDiv.textContent = 'Hervorragend! Du hast alle Paare richtig zugeordnet! 🎉';
                resetBtn.style.display = 'inline-block';
            }
        } else {
            // Fehlversuch: Visuelle Selektion aufheben
            firstSelectedCard.classList.remove('selected');
            
            // Kurzes optisches Signal auf der aktuell geklickten Karte setzen
            secondSelectedCard.classList.add('selected');
            setTimeout(() => {
                secondSelectedCard.classList.remove('selected');
            }, 300);

            resultDiv.style.color = '#e74c3c';
            resultDiv.textContent = 'Das passt leider nicht zusammen. Versuche es noch einmal!';
            firstSelectedCard = null;
        }
    }

    // Event-Listener für den Neustart-Button
    resetBtn.addEventListener('click', initGame);

    // Erster Spielstart beim Seitenaufruf
    initGame();
</script>

</body>
</html>
