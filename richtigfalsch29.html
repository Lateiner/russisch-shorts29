<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch lernen: Richtig oder Falsch?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            position: relative;
        }

        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }

        .progress {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* Die Swipe-Karte */
        .card-container {
            position: relative;
            height: 240px;
            margin-bottom: 30px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            position: absolute;
            transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.3s;
            cursor: grab;
            user-select: none;
            touch-action: none; /* Verhindert Scrollen beim Swipen */
        }

        .card:active {
            cursor: grabbing;
        }

        /* Visuelles Feedback beim Swipen/Bewerten */
        .card.swipe-right-visual {
            background-color: #e8f8f0;
            border-color: #2ecc71;
        }

        .card.swipe-left-visual {
            background-color: #fceae9;
            border-color: #e74c3c;
        }

        /* Klick-Buttons für den Desktop */
        .buttons-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .btn-choice {
            flex: 1;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-choice:active {
            transform: scale(0.98);
        }

        .btn-false {
            background-color: #e74c3c;
        }

        .btn-true {
            background-color: #2ecc71;
        }

        /* Feedback-Zustand nach Beendigung */
        .end-screen {
            text-align: center;
            padding: 20px 0;
        }

        .score-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .btn-restart {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .game-container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .card {
                font-size: 1.1rem;
                padding: 15px;
            }
            
            /* Auf Smartphones Hinweis zur Wischgeste einblenden */
            .card-container::after {
                content: "← Wische nach links (Falsch) oder rechts (Richtig) →";
                position: absolute;
                bottom: -22px;
                width: 100%;
                text-align: center;
                font-size: 0.75rem;
                color: #95a5a6;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-view">
        <h1>Richtig oder Falsch?</h1>
        <div class="progress" id="progress-text">Frage 1 von 6</div>

        <div class="card-container">
            <div class="card" id="swipe-card">
                <!-- Aussage wird per JS geladen -->
            </div>
        </div>

        <div class="buttons-container" id="action-buttons">
            <button class="btn-choice btn-false" id="btn-false">Falsch</button>
            <button class="btn-choice btn-true" id="btn-true">Richtig</button>
        </div>
    </div>

    <!-- Endbildschirm (standardmäßig unsichtbar) -->
    <div id="end-view" class="end-screen" style="display: none;">
        <h1>Spiel beendet!</h1>
        <div class="score-text" id="score-display">Du hast 0 von 0 Punkten erreicht.</div>
        <button class="btn-restart" id="btn-restart">Neustart</button>
    </div>
</div>

<script>
    // Aussagen-Katalog: Erweitert auf genau 6 abwechslungsreiche Fragen zur Anleitung
    const questions = [
        { text: "Das Wort кофта bedeutet übersetzt Hose.", answer: false },
        { text: "Wenn man die Kleidung mit der Rückseite nach vorne trägt, ist das шиворот-навыворот.", answer: true },
        { text: "Der Ausdruck переоденься bedeutet auffordernd: Zieh dich um!", answer: true },
        { text: "Historisch gesehen bedeutete das russische Wort шиворот übersetzt Ärmel.", answer: false },
        { text: "Der Wortbestandteil навыворот bedeutet umgedreht oder von innen nach außen.", answer: true },
        { text: "Im Satz „Ира, ты надела свою кофту...“ nutzt man надела, weil Ira eine Frau ist.", answer: true }
    ];

    let currentIndex = 0;
    let score = 0;

    const card = document.getElementById('swipe-card');
    const progressText = document.getElementById('progress-text');
    const btnFalse = document.getElementById('btn-false');
    const btnTrue = document.getElementById('btn-true');
    const btnRestart = document.getElementById('btn-restart');
    const gameView = document.getElementById('game-view');
    const endView = document.getElementById('end-view');
    const scoreDisplay = document.getElementById('score-display');

    // --- SPIEL-STEUERUNG ---
    function initGame() {
        currentIndex = 0;
        score = 0;
        endView.style.display = 'none';
        gameView.style.display = 'block';
        resetCardVisuals();
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex < questions.length) {
            progressText.textContent = `Frage ${currentIndex + 1} von ${questions.length}`;
            card.textContent = questions[currentIndex].text;
            resetCardVisuals();
        } else {
            showEndScreen();
        }
    }

    function evaluateAnswer(userChoice) {
        const isCorrect = userChoice === questions[currentIndex].answer;
        if (isCorrect) score++;

        // Karte visuell animieren und wegschießen
        card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
        if (userChoice === true) {
            card.style.transform = 'translateX(150%) rotate(20deg)';
        } else {
            card.style.transform = 'translateX(-150%) rotate(-20deg)';
        }
        card.style.opacity = '0';

        // Nächste Frage vorbereiten
        currentIndex++;
        setTimeout(() => {
            showQuestion();
        }, 300);
    }

    function resetCardVisuals() {
        card.style.transition = 'none';
        card.style.transform = 'translateX(0) rotate(0deg)';
        card.style.opacity = '1';
        card.className = 'card';
    }

    function showEndScreen() {
        gameView.style.display = 'none';
        endView.style.display = 'block';
        scoreDisplay.textContent = `Du hast ${score} von ${questions.length} Fragen richtig beantwortet!`;
    }

    // --- KLICK-EVENTS (Desktop) ---
    btnTrue.addEventListener('click', () => evaluateAnswer(true));
    btnFalse.addEventListener('click', () => evaluateAnswer(false));
    btnRestart.addEventListener('click', initGame);


    // --- TOUCH-SWIPE LOGIK (Smartphone & Tablet) ---
    let startX = 0;
    let currentX = 0;
    const swipeThreshold = 80; // Pixelwert, ab dem ein Swipe zählt

    card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        card.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
        currentX = e.touches[0].clientX;
        const deltaX = currentX - startX;
        
        // Karte mit dem Finger leicht mitbewegen und drehen (Tinder-Effekt)
        card.style.transform = `translateX(${deltaX}px) rotate(${deltaX * 0.05}deg)`;

        // Visuelle Färbung während des Ziehens
        if (deltaX > 20) {
            card.className = 'card swipe-right-visual';
        } else if (deltaX < -20) {
            card.className = 'card swipe-left-visual';
        } else {
            card.className = 'card';
        }
    }, { passive: true });

    card.addEventListener('touchend', () => {
        const deltaX = currentX - startX;

        // Wenn die Bewegung nicht ausreichte: Karte zurückfedern lassen
        if (Math.abs(deltaX) < swipeThreshold || currentX === 0) {
            card.style.transition = 'transform 0.2s ease, background-color 0.2s';
            card.style.transform = 'translateX(0) rotate(0deg)';
            card.className = 'card';
        } else {
            // Ausreichender Swipe registriert
            if (deltaX > 0) {
                evaluateAnswer(true);  // Swipe Rechts = Richtig
            } else {
                evaluateAnswer(false); // Swipe Links = Falsch
            }
        }
        // Werte für die nächste Geste zurücksetzen
        startX = 0;
        currentX = 0;
    });

    // Erster Start
    initGame();
</script>

</body>
</html>
