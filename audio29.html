<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russisch lernen: Audio-Verständnis (6 Aufgaben)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }

        .progress {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .instruction {
            text-align: center;
            color: #555;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Großer Play-Button */
        .audio-zone {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .play-btn {
            background-color: #3498db;
            color: white;
            border: none;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.3);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .play-btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 14px solid transparent;
            border-left: 22px solid white;
            border-bottom: 14px solid transparent;
            margin-left: 6px;
        }

        /* Antwort-Kacheln */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .option-card {
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .option-card:hover {
            border-color: #3498db;
            background-color: #f0f7fc;
            transform: translateY(-2px);
        }

        /* Zustände für die Auswertung */
        .option-card.correct {
            background-color: #e8f8f0 !important;
            border-color: #2ecc71 !important;
            color: #27ae60 !important;
        }

        .option-card.wrong {
            background-color: #fceae9 !important;
            border-color: #e74c3c !important;
            color: #c0392b !important;
        }

        .option-card.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .option-card.correct.disabled, .option-card.wrong.disabled {
            opacity: 1;
        }

        /* Feedback und Nav-Button */
        .feedback-message {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            margin-bottom: 20px;
        }

        .feedback-message.success { color: #2ecc71; }
        .feedback-message.error { color: #e74c3c; }

        .btn-next {
            display: none;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 auto;
        }

        .btn-next:hover {
            background-color: #1a252f;
        }

        /* Endbildschirm */
        .end-screen {
            text-align: center;
            padding: 20px 0;
        }

        .score-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .game-container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .option-card {
                padding: 14px;
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-view">
        <h1>Hörverständnis</h1>
        <div class="progress" id="progress-text">Aufgabe 1 von 6</div>
        <p class="instruction">Klicke auf Play und wähle das richtige Wort oder den richtigen Satz aus.</p>

        <div class="audio-zone">
            <button class="play-btn" id="play-audio-btn" title="Audio abspielen">
                <div class="play-icon"></div>
            </button>
        </div>

        <div class="options-grid" id="options-container">
            <!-- Dynamisch geladen -->
        </div>

        <div id="feedback" class="feedback-message"></div>
        <button class="btn-next" id="next-btn">Weiter</button>
    </div>

    <!-- Endbildschirm -->
    <div id="end-view" class="end-screen" style="display: none;">
        <h1>Hörtraining beendet!</h1>
        <div class="score-text" id="score-display">Du hast 0 von 6 Punkten erreicht.</div>
        <button class="btn-next" id="restart-btn" style="display: block;">Nochmal starten</button>
    </div>
</div>

<script>
    // Der strukturierte Aufgabenkatalog mit 6 Höraufgaben (Wörter und Sätze aus dem Kontext)
    const audioQuestions = [
        {
            audioText: "Переоденься",
            options: [
                { text: "Переоденься", isCorrect: true },
                { text: "Оденься", isCorrect: false },
                { text: "Разденься", isCorrect: false },
                { text: "Приоденься", isCorrect: false }
            ]
        },
        {
            audioText: "Кофту",
            options: [
                { text: "Юбку", isCorrect: false },
                { text: "Шапку", isCorrect: false },
                { text: "Кофту", isCorrect: true },
                { text: "Куртку", isCorrect: false }
            ]
        },
        {
            audioText: "Шиворот-навыворот",
            options: [
                { text: "Навыворот-шиворот", isCorrect: false },
                { text: "Шиворот-навыворот", isCorrect: true },
                { text: "Прямо-навыворот", isCorrect: false },
                { text: "Шиворот-наоборот", isCorrect: false }
            ]
        },
        {
            audioText: "Надела",
            options: [
                { text: "Надел", isCorrect: false },
                { text: "Надела", isCorrect: true },
                { text: "Сняла", isCorrect: false },
                { text: "Переодела", isCorrect: false }
            ]
        },
        {
            audioText: "Ира, ты надела свою кофту",
            options: [
                { text: "Ира, ты надела свою юбку", isCorrect: false },
                { text: "Игорь, ты надел свою кофту", isCorrect: false },
                { text: "Иra, ты сняла свою кофту", isCorrect: false },
                { text: "Ира, ты надела свою кофту", isCorrect: true }
            ]
        },
        {
            audioText: "Переоденься быстро",
            options: [
                { text: "Переоденься быстро", isCorrect: true },
                { text: "Оденься быстро", isCorrect: false },
                { text: "Разденься быстро", isCorrect: false },
                { text: "Иди переоденься", isCorrect: false }
            ]
        }
    ];

    let currentIndex = 0;
    let score = 0;

    const playBtn = document.getElementById('play-audio-btn');
    const optionsContainer = document.getElementById('options-container');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    
    const gameView = document.getElementById('game-view');
    const endView = document.getElementById('end-view');
    const scoreDisplay = document.getElementById('score-display');
    const restartBtn = document.getElementById('restart-btn');

    // --- TEXT-TO-SPEECH (SPRACHAUSGABE) ---
    function playAudio() {
        window.speechSynthesis.cancel();
        const currentQuestion = audioQuestions[currentIndex];
        const utterance = new SpeechSynthesisUtterance(currentQuestion.audioText);
        utterance.lang = 'ru-RU';
        utterance.rate = 0.82; // Geringfügig langsamer für optimale Verständlichkeit
        window.speechSynthesis.speak(utterance);
    }

    // --- SPIELLOGIK ---
    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function loadQuestion() {
        optionsContainer.innerHTML = '';
        feedback.textContent = '';
        feedback.className = 'feedback-message';
        nextBtn.style.display = 'none';
        
        progressText.textContent = `Aufgabe ${currentIndex + 1} von ${audioQuestions.length}`;
        
        // Optionen mischen und rendern
        const currentQuestion = audioQuestions[currentIndex];
        const shuffledOptions = shuffleArray([...currentQuestion.options]);

        shuffledOptions.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.textContent = opt.text;
            card.addEventListener('click', () => handleSelection(card, opt.isCorrect));
            optionsContainer.appendChild(card);
        });

        // Audio direkt bei Aufgabenwechsel einmal kurz anspielen
        setTimeout(playAudio, 300);
    }

    function handleSelection(selectedCard, isCorrect) {
        const allCards = document.querySelectorAll('.option-card');
        const currentQuestion = audioQuestions[currentIndex];

        if (isCorrect) {
            selectedCard.classList.add('correct');
            feedback.textContent = "Richtig! Hervorragend gehört! 🎉";
            feedback.className = "feedback-message success";
            score++;
        } else {
            selectedCard.classList.add('wrong');
            feedback.textContent = "Leider nicht ganz richtig.";
            feedback.className = "feedback-message error";
            
            // Richtige Antwortkarte grün markieren
            allCards.forEach(card => {
                if (card.textContent === currentQuestion.options.find(o => o.isCorrect).text) {
                    card.classList.add('correct');
                }
            });
        }

        allCards.forEach(card => card.classList.add('disabled'));
        nextBtn.style.display = 'block';
    }

    function handleNext() {
        currentIndex++;
        if (currentIndex < audioQuestions.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        gameView.style.display = 'none';
        endView.style.display = 'block';
        scoreDisplay.textContent = `Du hast ${score} von ${audioQuestions.length} Aufgaben richtig gelöst!`;
    }

    function restartGame() {
        currentIndex = 0;
        score = 0;
        endView.style.display = 'none';
        gameView.style.display = 'block';
        loadQuestion();
    }

    // Event-Verknüpfungen
    playBtn.addEventListener('click', playAudio);
    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', restartGame);

    // Erster Start der Anwendung
    loadQuestion();
</script>

</body>
</html>
